name: Daily Build

on:
  # schedule:  # Using cron-job.org
  #   - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD format)"
        required: false
        type: string

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build hook
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            curl -X POST -d '${{ inputs.date }}' ${{ secrets.BUILD_HOOK_URL }}
          else
            curl -X POST ${{ secrets.BUILD_HOOK_URL }}
          fi
